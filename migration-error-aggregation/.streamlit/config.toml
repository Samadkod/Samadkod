[theme]
primaryColor = "#2E75B6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#1F4E78"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[server]
headless = true
port = 8501
maxUploadSize = 200
enableXsrfProtection = true

[logger]
level = "info"

[ui]
hideTopBar = false
hideSidebarNav = false
